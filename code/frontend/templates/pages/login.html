{% extends "layouts/base.html" %}
{% block title %}Log in — SmartReco{% endblock %}

{% block content %}
<h1>Log in</h1>

<form method="post" action="/login" class="form form-narrow">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ email|default('') }}" required />

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required />

  <button type="submit">Log in</button>
</form>

<p class="muted">No account yet? <a href="/register">Register</a>.</p>
{% endblock %}
