{% extends "layouts/base.html" %}
{% block title %}Log in — SmartReco{% endblock %}

{% block content %}
<div class="form form-narrow">
  <h1>Log in</h1>
  <p class="muted small form-lede">What you read is what shapes the recommendations.</p>

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email|default('') }}" placeholder="learner@example.com" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required />

    <button type="submit" class="button-block">Log in</button>
  </form>

  <p class="muted small form-footnote">
    No account yet? <a href="/register">Register</a>
  </p>
</div>
{% endblock %}
