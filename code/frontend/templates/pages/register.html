{% extends "layouts/base.html" %}
{% block title %}Register — SmartReco{% endblock %}

{% block content %}
<div class="form form-narrow">
  <h1>Create an account</h1>
  <p class="muted small form-lede">Register to start building your interest profile.</p>

  <form method="post" action="/register">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email|default('') }}" placeholder="learner@example.com" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" placeholder="••••••••" required />
    <p class="muted small field-note">At least 8 characters.</p>

    <button type="submit" class="button-block">Register</button>
  </form>

  <p class="muted small form-footnote">
    Already registered? <a href="/login">Log in</a>
  </p>
</div>
{% endblock %}
