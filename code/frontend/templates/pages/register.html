{% extends "layouts/base.html" %}
{% block title %}Register — SmartReco{% endblock %}

{% block content %}
<h1>Create an account</h1>

<form method="post" action="/register" class="form form-narrow">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ email|default('') }}" required />

  <label for="password">Password</label>
  <input type="password" id="password" name="password" minlength="8" required />
  <p class="muted small">At least 8 characters.</p>

  <button type="submit">Register</button>
</form>

<p class="muted">Already registered? <a href="/login">Log in</a>.</p>
{% endblock %}
